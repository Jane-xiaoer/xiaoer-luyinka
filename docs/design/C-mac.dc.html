<style>

</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#efece3;color:#22211d;font-family:'Noto Sans SC','PingFang SC',sans-serif;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid #d6d1c2">
  <div style="height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #d6d1c2">
    <span style="width:12px;height:12px;border-radius:99px;background:#e0605a"></span><span style="width:12px;height:12px;border-radius:99px;background:#e6b84a"></span><span style="width:12px;height:12px;border-radius:99px;background:#6cbf5a"></span>
    <span style="flex:1"></span>
    <span style="font-size:13px;color:#5d5a52">‹ 10/17　　10/19 ›</span>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <main style="flex:1;padding:36px 48px;display:flex;flex-direction:column;gap:22px;min-width:0">
      <div style="display:flex;align-items:baseline;gap:18px">
        <span style="font-family:'Noto Serif SC',serif;font-size:88px;font-weight:900;line-height:1;color:#4A7A23">18</span>
        <div><div style="font-family:'Noto Serif SC',serif;font-size:22px;font-weight:600">十月 · 周六</div><div style="font-size:14px;color:#5d5a52">录了 6 小时 12 分 · 5 段</div></div>
      </div>
      <p style="margin:0;font-family:'Noto Serif SC',serif;font-size:22px;line-height:1.6;max-width:640px">今天定下了两件事：10/25 发版，下周三前把合同发给老王。</p>
      <div style="display:flex;flex-direction:column;border-left:2px solid #c9d8b4;margin-left:6px;gap:14px;padding-left:22px">
        <div><div style="font-size:13px;color:#7a776d">09:40 · 开会</div><div style="font-size:17px;font-weight:600">周会：下周发布排期</div></div>
        <div><div style="font-size:13px;color:#4A7A23">11:05 · 商业洽谈 · 老王</div><div style="font-size:17px;font-weight:600">跟老王谈报价</div><div style="font-size:14px;color:#5d5a52;margin-top:2px">「年付的话可以给你打个八折」</div></div>
        <div><div style="font-size:13px;color:#7a776d">14:30 · 学习听课</div><div style="font-size:17px;font-weight:600">AI 编程分享会</div></div>
        <div><div style="font-size:13px;color:#7a776d">15:02 · 自言自语</div><div style="font-size:17px;font-weight:600">规划去清迈</div></div>
        <div><div style="font-size:13px;color:#7a776d">19:10 · 生活日常 · 妈妈</div><div style="font-size:17px;font-weight:600">和妈妈吃饭</div></div>
      </div>
    </main>
    <aside style="width:380px;border-left:1px solid #d6d1c2;padding:32px 28px;display:flex;flex-direction:column;gap:22px;background:#f5f3ec">
      <div>
        <div style="font-size:13px;font-weight:700;color:#8a4f12;margin-bottom:10px">要办的 · 4</div>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:15px">
          <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:18px;height:18px;margin-top:3px">把合同发给老王 · 下周三前</label>
          <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:18px;height:18px;margin-top:3px">测试周三前交</label>
          <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:18px;height:18px;margin-top:3px">查清迈 11 月的住处</label>
          <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" style="width:18px;height:18px;margin-top:3px">问妈妈大理想住几天</label>
        </div>
      </div>
      <div>
        <div style="font-size:13px;font-weight:700;color:#4A7A23;margin-bottom:10px">把今天交给</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="dest">Claude Code · 按我的整理规则</button>
          <button class="dest">复制给任意 AI（豆包 / Kimi / ChatGPT）</button>
          <button class="dest">飞书 · 多维表格和日历</button>
        </div>
      </div>
      <span style="flex:1"></span>
      <form style="display:flex;gap:8px;align-items:center;background:#fbfaf7;border:1px solid #d6d2c6;border-radius:14px;padding:6px 6px 6px 14px">
        <label for="qc" style="position:absolute;left:-9999px">问问这一天</label>
        <input id="qc" placeholder="问问这一天…" style="flex:1;border:0;background:none;font:inherit;font-size:14px;outline:none;min-width:0">
        <button style="height:36px;padding:0 14px;border-radius:10px;border:0;background:#4A7A23;color:#fff;font:inherit;font-size:14px">问</button>
      </form>
    </aside>
  </div>
</div>
</x-dc>
